name: Build Barbados News portal

on:
  push:
    branches: [main]
    paths:
      - 'data/articles.json'
      - 'data/barbados_feed.json'
      - 'scripts/**'
      - 'site_assets/**'
      - 'site.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Fetch WordPress announcements
        run: python3 scripts/fetch_wordpress.py
      - name: Preserve WordPress news cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/barbados_feed.json; then
            echo "WordPress news cache unchanged."
            exit 0
          fi
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/barbados_feed.json?ref=main" --jq '.sha')
          ENCODED=$(base64 -w 0 data/barbados_feed.json)
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/data/barbados_feed.json" \
              -f message="chore: refresh BarbadosNews announcements" \
              -f branch=main \
              -f sha="$CURRENT_SHA" \
              -f content="$ENCODED"; then
            echo "New WordPress announcements cached in the repository."
          else
            echo "::warning::Could not persist WordPress RSS cache; deployment will still continue."
          fi
      - name: Build Barbados News site
        run: python3 scripts/build_site.py
      - name: Upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Google ownership endpoints
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          URL="${SITE_URL%/}/"
          echo "Search Console URL-prefix must be: $URL"
          for attempt in 1 2 3; do
            echo "Checking publicly available files (attempt $attempt)"
            if curl --location --fail --silent --show-error --connect-timeout 8 --max-time 20 "$URL" -o /tmp/barbados-home.html &&
               grep -Fq 'content="NT_aZGzdx528vjXi0VBtSmfidKqQYxohp0-GL30Bhxo"' /tmp/barbados-home.html &&
               curl --location --fail --silent --show-error --connect-timeout 8 --max-time 20 "${URL}google63bfe946f258bfc6.html" -o /tmp/google-verify.html &&
               grep -Fxq 'google-site-verification: google63bfe946f258bfc6.html' /tmp/google-verify.html; then
              echo "PUBLIC GOOGLE VERIFICATION PASSED. HTML tag and verification file are both reachable at $URL"
              exit 0
            fi
            echo "::warning::Public Google verification not available on attempt $attempt"
            sleep 4
          done
          echo "::warning::Verification content exists in build but could not be confirmed at the public URL. Check GitHub Pages settings and URL-prefix in Search Console."
